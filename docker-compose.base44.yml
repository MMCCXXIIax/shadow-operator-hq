# Base44 sandbox / development stack for Shadow Operator HQ.
#
# Runs the workspace straight from the cloned source (no prebuilt app images):
#   db     - PostgreSQL 16 (infrastructure only)
#   setup  - one-shot: installs workspace deps + runs SQL migrations + pushes the Drizzle schema
#   api    - Express API (@workspace/api-server) on :8080
#   web    - Vite dev server (@workspace/lead-tracker), published on host :3000
#
# The web dev server proxies /api to the api service, so the browser talks to a
# single origin (cookies stay first-party).
#
#   docker compose -f docker-compose.base44.yml up -d --build

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12

  setup:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@10 --no-fund --no-audit >/dev/null
        CI=true pnpm install --frozen-lockfile
        # Checked-in, transactional SQL migrations first (additive, recorded in
        # schema_migrations), then a NON-forced push so a destructive drift can
        # never be applied silently.
        pnpm --filter @workspace/db run migrate
        pnpm --filter @workspace/db run push

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=8080
      - NODE_ENV=development
      - DATABASE_URL=postgresql://app:app@db:5432/app
      # Browser origin of the preview; the API refuses credentialed CORS from
      # anything else. Referenced, never hardcoded, because the suffix rotates.
      - CORS_ALLOWED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX},http://localhost:5173
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@10 --no-fund --no-audit >/dev/null
        exec pnpm --filter @workspace/api-server run dev
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
    environment:
      - PORT=5173
      - BASE_PATH=/
      - NODE_ENV=development
      # Vite dev-server proxy target for /api (see artifacts/lead-tracker/vite.config.ts)
      - API_PROXY_TARGET=http://api:8080
      # Passed through by the platform; only consumed when BASE44_PREVIEW_MODE=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@10 --no-fund --no-audit >/dev/null
        exec pnpm --filter @workspace/lead-tracker run dev
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  db-data:
